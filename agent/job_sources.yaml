# Job searches the crawler runs. Edit by hand.
#
# type: linkedin    — LinkedIn's public jobs-guest endpoints. REQUIRES query
#                     and location. See the robots.txt warning in
#                     jobs/sources/linkedin.py before enabling more of these.
#                     Each linkedin source deliberately fetches ONE page — 10
#                     results per search, per run. JOBS_MAX_PER_SOURCE (25) is
#                     therefore unreachable here; it governs the two below.
#                     Want more LinkedIn results? Add another search, with the
#                     robots.txt warning in mind. Don't reach for the cap.
# type: greenhouse  — a company's Greenhouse board. REQUIRES slug: the name in
#                     boards.greenhouse.io/<slug>.
# type: lever       — a company's Lever board. REQUIRES slug: the name in
#                     jobs.lever.co/<slug>.
#
# enabled: false keeps a source installed but sits it out. A missing key means
# enabled. The quoted forms "false"/"no"/"off" count as disabled too, so a
# stray pair of quotes cannot silently leave a source running. Disabled sources
# are printed at load so a skipped source never looks like one that found
# nothing.
#
# company: optional. Greenhouse and Lever return only the board slug, so the
# crawler title-cases it. Set this where that guess reads badly.

sources:
  - name: linkedin-frontend-syd
    type: linkedin
    query: "frontend engineer"
    location: "Sydney, New South Wales, Australia"
    jobage: 14

  - name: linkedin-ai-syd
    type: linkedin
    query: "AI engineer"
    location: "Sydney, New South Wales, Australia"
    jobage: 14

  # Two robots-clean boards, enabled, so the first run of a fresh checkout does
  # not exercise the ToS-violating LinkedIn source alone. Both slugs are real
  # and return job JSON today. If a board is renamed or withdrawn the API 404s,
  # Fetcher raises FetchError, and run_jobs_batch's per-source isolation logs it
  # and moves on — a stale slug here costs one log line, not the run.
  - name: greenhouse-databricks
    type: greenhouse
    slug: databricks
    company: Databricks   # the title-cased slug reads the same, but be explicit

  - name: lever-palantir
    type: lever
    slug: palantir
    company: Palantir Technologies   # title-cased "palantir" loses the company
