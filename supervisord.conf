[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Backend and agent both connect to Postgres on startup, so they crash-loop
# until the database accepts connections. autorestart handles that.
#
# The backend runs EF migrations and owns every table in the database, the
# agent's included — the agent no longer creates anything. Lower priority
# starts first so the schema is in place before the agent queries it; if the
# agent still wins the race on a slow migration, autorestart covers it.

[program:backend]
priority=10
command=dotnet /app/backend/JobApplicationTracker.dll
directory=/app/backend
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
priority=20
command=/opt/venv/bin/uvicorn followup_agent.main:app --host 127.0.0.1 --port 8000
directory=/app/agent
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/app/web
environment=PORT="3000",HOSTNAME="127.0.0.1"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
